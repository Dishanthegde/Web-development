<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        ol{
            background-color: #000;
            color: white;
        }
        ul{
            background-color: #000;
            color: white;
        }
    </style>
    <ol type="A">
        <li>
            this is the first ordered list item
        </li>
    </ol>
    
    <ul type="circle">
        <li>
            this is the first unordered list item
        </li>
    </ul>
    <ol type="1" start="90" reversed>
        <li>Dwase</li>
        <li>Idli</li>
        <li>Uthapam</li>
        <li>Vada</li>
    </ol>

    <ul type="square">
        <li>Tiger</li>
        <li>Lion</li>
        <li>Elephant</li>
        <li>Giraffe</li>
    </ul>
    <h2>using description tag</h2>
    <dl>
        <dt>semantic tags</dt>
        <dd>tag that tells its meaning</dd>
    </dl>

    <h4>nested list</h4>
    <ol>
        <li> using ul inside ol
            <ul>
                <li>a</li>
                <li>b</li>
                <li>c</li>
            </ul>
        </li>
        <li></li>
        <li></li>
        <li></li>
    </ol>
</body>
</html>
