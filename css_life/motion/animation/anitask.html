<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 10;
            padding: 100;
            box-sizing: border-box;
        }

        body {
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main {
            height: 900px;
            width: 900px;
            /* border: 1px solid white; */
            display: flex;
            flex-direction: row;
            position: relative;
            /* padding: 20px; */

        }

        .child {
            padding: 20px;
            height: 100%;
            width: 10%;
            border-style: dotted;

        }

        #box1 {
            border-left: 1px;
            border-color: white;
            border-right: 1px solid;
            border-bottom: 1px;
            border-top: 1px;
        }

        #box2 {
            border-color: white;
            border-right: 1px solid;
            border-top: 1px;
        }

        #box3 {
            border-color: white;
            border-right: 1px solid;
            border-bottom: 1px;
        }

        #box4 {
            border-color: white;
            border-right: 1px dotted white;
            border-top: 1px;
        }

        #box5 {
            border-color: white;
            border-right: 1px dotted white;
            border-bottom: 1px;
            border-left: 1px dotted white;
        }

        .box {
            /* padding: 20px; */
            height: 20px;
            width: 20px;
            background-color: red;
            animation: batmen;
            animation-duration: 5s;
            animation-timing-function: ease-in;
            position: absolute;
            left: 80px;
            top: -10px;
            /* animation-iteration-count: infinite; */
            /* animation-direction: alternate-reverse; */
        }

        @keyframes batmen {
            10% {
                transform: translate(0px, 900px) rotate(0deg);
            }

            20% {
                transform: translate(90px, 900px) rotate(90deg);
            }

            30% {
                transform: translate(90px, 0px) rotate(180deg);
            }

            40% {
                transform: translate(180px, 0px) rotate(270deg);
            }

            50% {
                transform: translate(180px, 900px) rotate(360deg);
            }

            60% {
                transform: translate(270px, 900px) rotate(360deg);
            }

            70% {
                transform: translate(270px, 0px) rotate(360deg);
            }

            80% {
                transform: translate(360px, 0px) rotate(360deg);
            }

            90% {
                transform: translate(360px, 900px) rotate(360deg);
            }

            100% {
                transform: translate(450px, 900px) rotate(360deg);
            }

        }
    </style>
</head>

<body>
    <div class="main">
        <div class="box"></div>
        <div class="child" id="box1">box1</div>
        <div class="child" id="box2"></div>
        <div class="child" id="box3"></div>
        <div class="child" id="box4"></div>
        <div class="child" id="box5"></div>
    </div>
</body>

</html>
