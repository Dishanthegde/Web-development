<!DOCTYPE html>

<head>

    <title>Document</title>
    <style>
        .main{
            height: 1000px;
            width: 1000px;
            border: 1px solid black;
            padding: 20px;
            display: grid;
            grid-template-rows: repeat(4,200px); 
            grid-template-columns: repeat(4,200px); 
        }

        .box{
            height: 200px;
            width: 200px;
            border: 1px solid red;
        }

        } */

</head>
<body>
