<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            height: 1000px;
            width: 1000px;
            border: 1px solid black;
            padding: 20px;
            display: grid;
            grid-auto-flow: row;
            grid-template-rows: repeat(4, 200px); 
            grid-template-columns: repeat(4, 200px); 
            justify-content: center;
            align-content: center;
        }

        .box{
            height: 200px;
            width: 200px;
            border: 1px solid red;
        }

        #box1{
            display: grid;
            background-color: green;
            /* grid-row-start:  2; */
            /* grid-column-start:  2;  */
            grid-row: 3/1;
            grid-column: 4;
            
        } 


    </style>
</head>
<body>
    <div class="main">
        <div class="box" id="box1">boxesssss</div>
        <div class="box" id="box2">boxes</div>
        <div class="box" id="box3">boxes</div>
        <div class="box" id="box4">boxes</div>
        <div class="box" id="box5">boxes</div>
        <div class="box" id="box6">boxes</div>
        <div class="box" id="box7">boxes</div>
        <div class="box" id="box8">boxes</div>
        <div class="box" id="box9">boxes</div> 
    </div>
</body>
</html>
