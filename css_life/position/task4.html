<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .main{
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        .sub{
            width: 200px;
            height: 200px;
            border-radius: 100%;
            position: absolute;
            border: 1px solid black;
            margin-top: 300px;
            margin-left: 500px;
            box-shadow: -2px 2px 2px black;
        }

        #p2{
            margin-left: 620px;
        }

        #p3{
            margin-left: 750px;
        }

        #p4{
            margin-left: 870px;
        }

        img{
            height: 95%;
            width: 95%;
            object-fit: cover;
            border-radius: 100%;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="sub" id="p1">
            <img src="../../Resources/Dani_olmo.jpg" alt="dani olmo">
        </div>
        <div class="sub" id="p2">
            <img src="../../Resources/gavi.jpg" alt="">
        </div>
        <div class="sub" id="p3">
            <img src="../../Resources/marc_bernal.png" alt="">
        </div>
        <div class="sub" id="p4">
            <img src="../../Resources/pedri.jpg" alt="">
        </div>
    </div>
</body>
</html>
