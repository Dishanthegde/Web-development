<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }

    h1{
        color: lightcoral;
    }

    h3{
        padding-top: 40px;
        padding-left: 5px;
        font-size: 40px;
    }
    p{
        font-size: 25px;
        padding-left: 10px;
    }
    .main {
        color: lab(100% 0.01 -0.01 / 0.814) !important;
        width: 950px;
        height: 750px;
        background-color: rgba(72, 91, 122, 0.3);
        border: 4px solid black;
        border-radius: 6%;
        margin-left: 450px;
    }

    .inner{
        height: 200px;
        width: 400px;
        position: absolute;
        border-radius: 8%;
        box-shadow: 4px -4px 4px gray;
    }

    #box1{
        background-color: rgb(0, 0, 255,0.6);
        margin-left: 60px;
        margin-top: 80px;
    }

    #box2{
        background-color: rgb(255, 0, 0);
        margin-top: 200px;
        margin-left: 210px;
    }

    #box3{
        background-color: rgb(81, 247, 69);
        margin-top: 330px;
        margin-left: 330px;
    }
    #box4{
        background-color: purple;
        margin-top: 460px;
        margin-left: 470px;
    }
</style>

<body>
    <center>
        <h1>GFG</h1>
    </center>
        <div class="main">
            <div class="inner" id="box1">
                <h3>Block1</h3>
                <p>content for block1</p>
            </div>
            <div class="inner" id="box2">
                <h3>Block2</h3>
                <p>content for block2</p>
            </div>
            <div class="inner" id="box3">
                <h3>Block3</h3>
                <p>content for block3</p>
            </div>
            <div class="inner" id="box4">
                <h3>Block4</h3>
                <p>content for block4</p>
            </div>
        </div>
</body>

</html>
