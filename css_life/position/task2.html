<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

        * {
            margin: 0;
            padding: 0;

        .main {

        }

            width: 600px;
            margin-top: 290px;

        #p1 {

            padding-top: 70px;
        }

        #p2 {
            font-size: 30px;
            position: relative;
            padding-top: 200px;
        }

        #p3 {
            font-size: 40px;
        }

        .text1{
            position: absolute;
            font-size: 40px;
            margin-left: 200px;

        }

</head>

<body>
    <div class="main">
        <div class="text1">
            <h1>title-page</h1>
