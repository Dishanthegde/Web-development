<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .main{
            background-color: rgba(255, 166, 0, .8);
            height: 600px;
            width: 100vw;
            padding-top: 20px;
            position: absolute;
        }
        .camera{
            font-size: 85px;
            padding-top: 250px;
            color: brown;
        }
        .profile{
            position: relative;
            border: 8px solid rgb(165, 42, 42, 0.9);
            height: 250px;
            width: 200px;
            margin-left: 50px;
            margin-top: 130px;
            border-radius: 13%;
        }
        .profile img{
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10%;
        }

        h1{
            color: rgb(165, 42, 42, 0.8);
            margin-left: 300px;
            margin-top: -5%;
        }
    </style>
</head>
<body>
    <div class="main">
        <center>
        <i class="fa-solid fa-camera camera"></i>
        </center>
        <div class="profile">
            <img src="/Resources/Lamine_yamal.png" alt="lamine yamal">
        </div>
        <h1>Lamine Yamal</h1>
    </div>
</body>
</html>
