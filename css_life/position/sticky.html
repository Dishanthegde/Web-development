<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        * {
            margin: 10px;
            padding: 10px;
        }
        .main{
            height: 10000px;
            width: 100vw;
            border: 2px solid black;
            background-color: rgba(94, 207, 207, 0.4);
        }
        .bo{
            height: 300px;
            width: 200px;
            border: 2px solid black;
            position: relative;
        }
        .fix {
            height: 600px;
            width: 300px;
            position: sticky;
            background-color: rgba(200, 188, 188, 0.8);
            border: 2px solid black;
            top: 230px;

        }

        .sub {
            height: 15px;
            width: 200px;
            border: 3px solid black;
            position: absolute;
            bottom: 20px;
            margin: 15px;
            color: black;
            background-color: rgb(161, 99, 219, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        img {
            height: 38px;
            width: 35px;
            position: absolute;
            right: 0px;
            bottom: 18px;

        }
    </style>
</head>

<body>
    <div class="main">
        <div class="bo">

        </div>
        <div class="fix">
            <div class="sub">
                <p>ask anythin here</p>


            </div>
            <img src="../../Resources/pedri.jpg" alt="pedri">
        </div>
    </div>

    <p>lorem1000</p>

</body>

</html>
