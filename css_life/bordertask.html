<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 100px;
        }
        .outer{
            width: 700px;
            height: 300px;
            border-left: 15px solid rgb(164, 37, 96);
            border-right: 15px solid rgb(253, 247, 68);
            border-bottom:15px solid skyblue;
            border-top: 15px solid green;
            border-top-right-radius: 50%;
            border-bottom-right-radius: 50%;
            border-top-left-radius: 14%;
            border-bottom-left-radius: 14%; 
            content: center;
        }
        .inner{
            height: 100%;
            width: 100%;
            box-sizing: border-box;
            border-left: 15px solid rgb(239, 31, 128);
            border-right: 15px solid rgb(140, 151, 23);
            border-bottom:15px solid rgb(49, 115, 141);
            border-top: 15px solid rgb(94, 229, 94);
            border-top-right-radius: 50%;
            border-bottom-right-radius: 50%;
            border-top-left-radius: 10%;
            border-bottom-left-radius: 10%;
            text-align: center;
            line-height: 200px;
            content: center;
        }

        .outer2{
            margin-top: 100px;
            width: 500px;
            height: 300px;
            border-left: 25px solid green;
            border-right: 25px solid green;
            border-top: 5px solid green;
            border-radius: 250px 250px 0 0;
        }
        .inner2{
            box-sizing: border-box;
            height: 100%;
            width: 100%;
            border-left: 25px solid greenyellow;
            border-right: 25px solid greenyellow;
            border-bottom: 11px dashed greenyellow;
            border-top: 5px solid greenyellow;
            text-align: center;
            line-height: 200px;
            content: center;   
            border-radius: 220px 220px 0 0;
        }

        .outer3{
            height: 300px;
            width: 500px;
            border-left: 10px solid rgb(182, 47, 157);
            border-right: 10px solid rgb(182, 47, 157);
            border-radius: 50% 50% 50% 50%;
            padding: 0px 5px 0px 5px;
        }

        .inner3{
            height: 100%;
            width: 100%;
            box-sizing: border-box;
            /* padding: 0px 25px 0px 25px; */
            border-left: 10px solid rgb(182, 47, 157);
            border-right: 10px solid rgb(182, 47, 157);
            border-radius: 50% 50% 50% 50%;
            text-align: center;
            line-height: 200px;
            content: center;  
        }

    </style>
</head>
<body>
    <div class="outer">
        <div class="inner"><h1>Advanced Bullet</h1></div>
    </div>

    <div class="outer2">
        <div class="inner2">
            <h1>Advanced Hemisphere</h1>
        </div>
    </div>

    <div class="outer3">
        <div class="inner3"><h1>Advanced Round Rectangle</h1>
        </div>
    </div>
</body>
</html>
