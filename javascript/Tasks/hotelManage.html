<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Hotel</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
}

.container {
    width: 80%;
    margin: 50px auto;
    text-align: center;
}

h1 {
    font-size: 40px;
    margin-bottom: 10px;
}

.subtitle {
    color: #666;
    margin-bottom: 40px;
}

.menu {
    display: flex;
    justify-content: center;
    gap: 25px;
}

.food {
    background-color: white;
    width: 220px;
    padding: 25px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
}

.food h2 {
    margin-bottom: 15px;
}

.food p {
    color: #666;
    margin-bottom: 10px;
}

.food h3 {
    margin-bottom: 20px;
}

button {
    background-color: #ff6b35;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background-color: #e85a2a;
}

#message {
    margin-top: 40px;
    font-size: 22px;
    font-weight: bold;
}
    </style>
</head>

<body>

    <div class="container">

        <h1>🍴 Grand Hotel</h1>
        <p class="subtitle">Welcome! Choose your favorite food.</p>

        <div class="menu">

            <div class="food">
                <h2>Pizza</h2>
                <p>Cheese Pizza</p>
                <h3>199rs</h3>
                <button onclick="orderFood('Pizza')">Order Now</button>
            </div>

            <div class="food">
                <h2>Burger</h2>
                <p>Cheese Burger</p>
                <h3>149rs</h3>
                <button onclick="orderFood('Burger')">Order Now</button>
            </div>

            <div class="food">
                <h2>Biryani</h2>
                <p>Chicken Biryani</p>
                <h3>249rs</h3>
                <button onclick="orderFood('Biryani')">Order Now</button>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
